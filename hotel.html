<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Hotel | Rajasthani Hotel And Restaurant</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav>
            <div class="wrap">
                <a class="logo" href="index.html">Rajasthani Hotel &amp; Restaurant</a>
                <button id="burger" aria-label="Menu">☰</button>
                <div class="links">
                    <a href="index.html" class="">Home</a>
                    <a href="restaurant.html" class="">Restaurant</a>
                    <a href="hotel.html" class="on">Hotel</a>
                    <a href="login.html" class="cta">Login / Sign Up</a>
                </div>
            </div>
        </nav>
        <header class="hero" style="padding:3rem 0">
            <div class="wrap">
                <h1 style="font-size:clamp(2.2rem,7vw,3.6rem)">Our rooms</h1>
                <p>Air-conditioned rooms on Station Road, Civil Lines. Check-in from 12 PM, check-out by 11 AM. Prices are per night.</p>
            </div>
        </header>
        <main class="wrap">
            <section>
                <div class="grid" id="rooms" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))"></div>
            </section>
            <section id="book">
                <div class="panel" style="max-width:560px;margin:auto">
                    <h2>Book a room</h2>
                    <form id="bf">
                        <label for="room">Room type</label>
                        <select id="room">
                            <option value="room">Standard Room</option>
                            <option value="deluxe">Deluxe Room</option>
                            <option value="room">Normal Room</option>
                        </select>
                        <div class="two" style="gap:.8rem">
                            <div>
                                <label for="in">Check-in</label>
                                <input id="in" type="date" required>
                            </div>
                            <div>
                                <label for="out">Check-out</label>
                                <input id="out" type="date" required>
                            </div> 
                        </div>
                        <label for="g">Guests</label>
                        <select id="g">
                            <option>1</option>
                            <option selected>2</option>
                            <option>3</option>
                        </select>
                        <label for="bn">Name</label>
                        <input id="bn" required autocomplete="name">
                        <label for="bp">Phone number</label>
                        <input id="bp" type="tel" inputmode="tel" required autocomplete="tel">
                        <p class="price" id="bsum" style="margin-top:1rem"></p>
                        <button class="btn" style="width:100%;margin-top:.8rem">Request booking</button>
                    </form>
                </div>
            </section>
        </main>
        <footer>
            <p>Rajasthani Hotel And Restaurant · Station Road, Civil Lines, Sitapur, UP 261001</p>
        </footer>
        <script src="app.js"></script>
        <script>
            const today = new Date().toISOString().slice(0, 10);
            const checkIn = document.getElementById('in');
            const checkOut = document.getElementById('out');
            const roomType = document.getElementById('room');

            checkIn.min = checkOut.min = today;
            [checkIn, checkOut, roomType].forEach((field) => {
                field.onchange = calc;
            });
            calc();

            bf.onsubmit = (e) => {
                e.preventDefault();
                if (calc() < 1) return toast('Check-out must be after check-in');
                /* TODO backend: send booking to your API */
                toast('Booking request sent (demo)');
                bf.reset();
                calc();
            };
        </script>
    </body>
</html>
