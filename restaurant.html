<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Restaurant | Rajasthani Hotel And Restaurant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Nunito+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="wrap"><a class="logo" href="index.html">Rajasthani Hotel &amp; Restaurant</a><button id="burger"
                aria-label="Menu">☰</button>
            <div class="links"><a href="index.html" class="">Home</a><a href="restaurant.html"
                    class="on">Restaurant</a><a href="hotel.html" class="">Hotel</a><a href="login.html"
                    class="cta">Login / Sign Up</a></div>
        </div>
    </nav>
    <main class="wrap" style="padding:2.5rem 0 6rem">
        <h2>Our menu</h2>
        <p style="color:var(--mute)">Pure vegetarian. Pick your dishes and order.</p>
        <div class="chips" id="chips"></div>
        <div class="grid" id="items"></div>
    </main>
    <button class="btn" id="cartbtn"></button>
    <div class="drawer" id="drawer">
        <div class="sheet">
            <div class="row" style="justify-content:space-between;align-items:center">
                <h2>Your order</h2><button class="btn line" data-close="1">Close</button>
            </div>
            <div id="lines"></div>
            <div id="sum"></div>
            <form id="checkout" class="hide">
                <h3 style="margin-top:1.2rem">Delivery details</h3><label for="cn">Name</label><input id="cn" required
                    autocomplete="name"><label for="cp">Phone number</label><input id="cp" type="tel" inputmode="tel"
                    required pattern="[0-9+ ]{10,14}" autocomplete="tel"><label for="ca">Address</label><textarea
                    id="ca" rows="3" required autocomplete="street-address"></textarea>
                <label for="pm">Payment method</label><select id="pm">
                    <option>Cash on delivery</option>
                    <option>UPI</option>
                    <option>Card</option>
                </select><button class="btn" style="width:100%;margin-top:1.2rem">Place order</button>
            </form>
        </div>
    </div>
    <footer>
        <p>Rajasthani Hotel And Restaurant · Station Road, Civil Lines, Sitapur, UP 261001</p>
    </footer>
    <script src="app.js"></script>
    <script>renderMenu(); renderCart();
        checkout.onsubmit = e => { e.preventDefault();/* TODO backend: send {cart,name,phone,address,payment} to your API */cart = {}; save(); renderCart(); document.getElementById('drawer').classList.remove('open'); checkout.reset(); toast('Order placed (demo). Thank you!') }</script>
</body>

</html>
